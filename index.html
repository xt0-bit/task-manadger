<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Мої завдання</title>
</head>
<body>

    <div>
        <div>
            <h1>Мої завдання</h1>
        </div>

        <div>
            <h2>Нове завдання</h2>
            <form>
                <div>
                    <div>
                        <label for="taskTitle">Назва завдання</label><br>
                        <input type="text" id="taskTitle" placeholder="Наприклад, здати лабораторну">
                    </div>
                    <div>
                        <label for="taskDate">Дедлайн</label><br>
                        <input type="date" id="taskDate">
                    </div>
                </div>
                <br>
                <button type="submit">Додати завдання</button>
            </form>
        </div>

        <h2>Список завдань</h2>
        <div>
            <div>
                <div>
                    <input type="checkbox">
                    <span>рівлдоажідф</span>
                </div>
                <div>10 груд. 2000 р.</div>
            </div>
            <div>
                <div>
                    <input type="checkbox">
                    <span>іфваіва</span>
                </div>
                <div>4 квіт. 2005 р.</div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
